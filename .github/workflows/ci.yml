name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobil (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  backend:
    name: Backend (mvn verify, Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify

  content-pipeline:
    name: İçerik boru hattı (pytest + content-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/content-pipeline/requirements-dev.txt
      - run: pip install -r tools/content-pipeline/requirements-dev.txt
      # Medya (mp3/png/mp4) git dışında: testler ve lint yalnızca metin, hizalama ve kurgu.json kullanır.
      - run: python -m pytest tools/content-pipeline
      - run: python tools/content-pipeline/content_lint.py icerik/A1-0* --graph-source kurgu
