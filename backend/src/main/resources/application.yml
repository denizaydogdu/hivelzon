# Ayarlar ortam değişkenlerinden okunur.
# Varsayılanlar yalnızca yerel geliştirme içindir (docker-compose.yml); sır içermez.
spring:
  application:
    name: hivelzon-backend
  config:
    # Yerel sırlar repo dışında (git'e girmez): ~/.config/hivelzon/backend.yml. Yoksa yok sayılır.
    import: optional:file:${HIVELZON_LOCAL_CONFIG:${user.home}/.config/hivelzon/backend.yml}
  datasource:
    url: ${HIVELZON_DB_URL:jdbc:postgresql://localhost:5435/hivelzon}
    username: ${HIVELZON_DB_USER:hivelzon}
    password: ${HIVELZON_DB_PASSWORD:hivelzon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  mail:
    # Yerelde projeye ait Mailpit (docker-compose.yml, SMTP 127.0.0.1:1027, arayüz http://127.0.0.1:8027).
    host: ${HIVELZON_SMTP_HOST:localhost}
    port: ${HIVELZON_SMTP_PORT:1027}
    username: ${HIVELZON_SMTP_USER:}
    password: ${HIVELZON_SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${HIVELZON_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${HIVELZON_SMTP_STARTTLS:false}

server:
  port: ${HIVELZON_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # E-posta sunucusuna ulaşılamaması uygulamayı "DOWN" göstermesin (giriş kodu gönderimi
    # MailPort'ta hatayla ele alınır). CI'da SMTP yok; yerelde Mailpit kapalı olabilir.
    mail:
      enabled: false

hivelzon:
  security:
    # Base64, en az 32 bayt. Tanımlı değilse: prod profilinde uygulama başlamaz; diğer profillerde
    # her açılışta geçici rastgele anahtar üretilir (yalnızca geliştirme).
    jwt-secret: ${HIVELZON_JWT_SECRET:}
    otp-pepper: ${HIVELZON_OTP_PEPPER:}
    issuer: hivelzon
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # H-056: dönen yenileme belirteci bu süre içinde yeniden gelirse aynı halef döner; 0s: kapalı.
    refresh-grace: ${HIVELZON_REFRESH_GRACE:30s}
  otp:
    ttl: 10m
    max-attempts: 5
  rate-limit:
    window: 1h
    otp-start-per-email: ${HIVELZON_RL_OTP_START_PER_EMAIL:5}
    otp-start-per-ip: ${HIVELZON_RL_OTP_START_PER_IP:20}
    otp-verify-per-ip: ${HIVELZON_RL_OTP_VERIFY_PER_IP:60}
    refresh-per-ip: ${HIVELZON_RL_REFRESH_PER_IP:120}
  account:
    deletion-grace-period: 30d
    minimum-age: 13
    adult-age: 18
  consent:
    # Metinlerin güncel sürümleri (uygulamadaki sürümle aynı tutulur). Sürüm değişince yeniden onay istenmez;
    # eski sürümü onaylamış hesap her şeyi kullanmaya devam eder, uygulama bildirim gösterir (H-095).
    terms-version: ${HIVELZON_TERMS_VERSION:taslak-2}
    privacy-notice-version: ${HIVELZON_PRIVACY_NOTICE_VERSION:taslak-2}
    marketing-version: ${HIVELZON_MARKETING_VERSION:taslak-1}
  mail:
    from: ${HIVELZON_MAIL_FROM:hiVelzon <no-reply@hi.velzon.tr>}
  catalog:
    # Geliştirme içe aktarması (POST /api/v1/admin/catalog/import, EDITOR/ADMIN). prod'da kapalı.
    import-root: ${HIVELZON_CATALOG_IMPORT_ROOT:../icerik}
    # Kitaplık paketleri (H-070): kitaplar/<id>-<slug>/_build/package/. Klasör yoksa kitaplar atlanır.
    books-import-root: ${HIVELZON_CATALOG_BOOKS_IMPORT_ROOT:../kitaplar}
    # Bağımsız reeller (H-094 P4): reeller/<id>-<slug>/ (_build/package/reel.json ya da kaynak reel.json).
    reels-import-root: ${HIVELZON_CATALOG_REELS_IMPORT_ROOT:../reeller}
    dev-import-enabled: ${HIVELZON_CATALOG_DEV_IMPORT:true}
    cache-max-age: 60s
  media:
    # VideoHostingPort (K-13): yerelde içerik sunucusu (tools/dev-content-server/serve.py); Bunny H-044'te.
    provider: local
    local-base-url: ${HIVELZON_MEDIA_LOCAL_BASE_URL:http://127.0.0.1:8787/packages/}
  sync:
    max-rows-per-push: 500
    max-push-bytes: 1048576
    max-default-body-bytes: 65536
    pull-default-limit: 200
    pull-max-limit: 500
    max-clock-skew: 5m
    push-per-hour: ${HIVELZON_RL_SYNC_PUSH_PER_USER:240}
    pull-per-hour: ${HIVELZON_RL_SYNC_PULL_PER_USER:1200}
    rate-per-hour: ${HIVELZON_RL_REVIEW_RATE_PER_USER:2000}
  retention:
    # Rıza kayıtları (hesap kalıcı silindikten sonra) ve denetim kaydı (olay tarihinden) saklama süresi (H-095).
    records: 2y
  jobs:
    enabled: ${HIVELZON_JOBS_ENABLED:true}
    purge-cron: "0 17 * * * *"
    cleanup-cron: "0 */15 * * * *"
    # H-095: süresi dolan rıza ve denetim kayıtlarının temizliği (her gün 03:41 UTC).
    retention-cron: "0 41 3 * * *"
  tts:
    # Türkçe seslendirme (Alania) ve Türkçe konuşma tanıma (Duyu), PatientDesk AI (kullanıcı kararı
    # 2026-10-14: yalnızca Türkçe cümleler). Anahtar yalnızca sunucuda; yerelde backend.yml'den,
    # sunucuda ortam değişkeninden. Tanımlı değilse Türkçe seslendirme kapalıdır.
    patientdesk:
      base-url: ${PD_API_URL:https://voice.patientdesk.ai}
      api-key: ${PD_API_KEY:}
      model: alania-v2
      voice: alania2-f1
      stt-model: duyu-1

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
