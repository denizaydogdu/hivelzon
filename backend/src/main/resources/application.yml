# Veritabanı ayarları ortam değişkenlerinden okunur.
# Varsayılanlar yalnızca yerel geliştirme içindir (docker-compose.yml); sır içermez.
spring:
  application:
    name: hivelzon-backend
  datasource:
    url: ${HIVELZON_DB_URL:jdbc:postgresql://localhost:5434/hivelzon}
    username: ${HIVELZON_DB_USER:hivelzon}
    password: ${HIVELZON_DB_PASSWORD:hivelzon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${HIVELZON_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
