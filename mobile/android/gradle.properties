org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# H-118: built-in Kotlin needs every Android plugin migrated. flutter_tts 4.2.5
# (latest) still applies kotlin-android unconditionally, so `true` fails with
# "plugin is no longer required since AGP 9.0". A per-module opt-in
# (com.android.built-in-kotlin on :app) is not possible either: with this flag
# false, the Flutter Gradle Plugin (3.50.1) applies kotlin-android to :app itself.
# Flip both flags to true once flutter_tts ships built-in Kotlin
# (dlutton/flutter_tts#660). Checked 2026-11-27 with a locally patched
# flutter_tts: builtInKotlin=true + newDsl=true build with no other change.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
